<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fama — Toma de Pedidos</title>
<style>
  :root{
    --bg: #0b4a44;
    --card: #12615a;
    --card-soft: #17756c;
    --cream: #ffffff;
    --accent: #e7b65c;
    --danger: #d9694f;
    --line: rgba(255,255,255,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--cream);
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
  }
  .wrap{ width:100%; max-width:480px; }
  .brand{ text-align:center; margin-bottom: 22px; }
  .logo{
    width:110px; height:110px; margin:0 auto;
    border-radius: 24px;
    overflow:hidden;
  }
  .logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .switch-row{
    display:flex; gap:10px; justify-content:center; margin-bottom: 26px;
  }
  .switch-btn{
    border:none; border-radius:999px; padding: 11px 20px; font-size:14px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .switch-btn.active{ background: var(--cream); color: var(--bg); }
  .switch-btn.inactive{ background: transparent; color: var(--cream); border: 1px solid var(--line); }

  .view{ display:none; }
  .view.visible{ display:block; }

  .title{ text-align:center; margin-bottom: 22px; }
  .title h2{ font-size: 17px; margin:0 0 4px; font-weight:600; }
  .title span{ font-size: 13px; opacity:0.7; }

  .card{
    background: var(--card);
    border-radius: 18px;
    padding: 24px 22px;
    border: 1px solid var(--line);
  }

  label.field-label{
    display:block; font-size:12.5px; opacity:0.9; margin-bottom:8px; margin-top:20px;
  }
  label.field-label:first-child{ margin-top:0; }

  select, input[type="text"], textarea{
    width:100%;
    background: var(--card-soft);
    border: 1px solid var(--line);
    color: var(--cream);
    font-weight: 700;
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus{
    outline: none;
    border-color: var(--accent);
  }
  textarea{ resize: vertical; min-height: 70px; }

  .add-row{ display:flex; gap:8px; }
  .add-row select{ flex:1; }
  .add-btn{
    flex:none;
    background: var(--accent);
    color: var(--bg);
    border:none;
    border-radius: 12px;
    padding: 0 18px;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
  }
  .add-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .selected-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .selected-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .selected-item .nombre{ font-size: 14.5px; font-weight: 600; flex:1; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--line);
    background: rgba(246,241,231,0.08); color: var(--cream); font-size:16px; font-weight:700;
    cursor:pointer; line-height:1;
  }
  .stepper .qty{ min-width:16px; text-align:center; font-weight:700; }

  .empty-hint{ font-size: 13px; opacity:0.6; padding: 10px 2px; }

  .submit-btn{
    width:100%;
    margin-top: 26px;
    background: var(--cream);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 15px;
    font-size: 15.5px;
    font-weight: 600;
    cursor:pointer;
  }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .status{ text-align:center; margin-top:16px; font-size: 13.5px; min-height: 18px; }
  .status.ok{ color: #bfe3a8; }
  .status.err{ color: var(--danger); }

  .foot-note{ text-align:center; font-size:11.5px; opacity:0.5; margin-top:18px; line-height:1.5; }

  /* --- Panel admin --- */
  .admin-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .admin-item{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--card-soft); border:1px solid var(--line); border-radius:12px;
    padding: 10px 12px; font-size:14.5px;
  }
  .admin-item button{
    background:none; border:none; color: var(--danger); font-size:18px; cursor:pointer; line-height:1;
  }
  .save-btn{
    width:100%; margin-top:26px; background: var(--accent); color: var(--bg);
    border:none; border-radius:999px; padding:15px; font-size:15.5px; font-weight:700; cursor:pointer;
  }
</style>
</head>

<script>// ⚠️ Reemplaza esto con la URL de tu Google Apps Script publicado como Web App
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8VRaG84TQbETcuvC_0FSglSdxB7NnD27rPn8lbGYSUOoGFN70f6PInxkGHXpg3gb2/exec";

// ---------- Cambio de vista (Tomar pedido / Panel del admin) ----------
const btnTabPedido = document.getElementById('btn-tab-pedido');
const btnTabAdmin = document.getElementById('btn-tab-admin');
const viewPedido = document.getElementById('view-pedido');
const viewAdmin = document.getElementById('view-admin');

const ADMIN_PIN = "2060";

btnTabPedido.addEventListener('click', () => mostrarVista('pedido'));
btnTabAdmin.addEventListener('click', () => {
  const intento = prompt("Clave del Panel del Admin:");
  if(intento === null) return; // canceló
  if(intento === ADMIN_PIN){
    mostrarVista('admin');
  }else{
    alert("Clave incorrecta.");
  }
});

function mostrarVista(nombre){
  const esPedido = nombre === 'pedido';
  viewPedido.classList.toggle('visible', esPedido);
  viewAdmin.classList.toggle('visible', !esPedido);
  btnTabPedido.classList.toggle('active', esPedido);
  btnTabPedido.classList.toggle('inactive', !esPedido);
  btnTabAdmin.classList.toggle('active', !esPedido);
  btnTabAdmin.classList.toggle('inactive', esPedido);
  if(!esPedido) renderAdmin();
}

document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-PE', {
  weekday: 'long', day: 'numeric', month: 'long'
});

// ---------- Estado del menú del día (cargado desde el Sheet) ----------
let menuActual = { entradas: [], menus: [], meseros: [] };

// Selecciones del mesero: [{nombre, cantidad}]
let entradasSel = [];
let menusSel = [];

async function cargarMenu(reintentar = true){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    menuActual.entradas = data.entradas || [];
    menuActual.menus = data.menus || [];
    menuActual.meseros = data.meseros || [];
  }catch(e){
    console.log("No se pudo cargar el menu, reintentando en 5s...", e);
    if(reintentar){
      setTimeout(() => cargarMenu(true), 5000);
    }
    return; // no borra lo que ya estaba cargado antes
  }
  llenarSelect(document.getElementById('select-entrada'), menuActual.entradas, 'Selecciona una entrada');
  llenarSelect(document.getElementById('select-menu'), menuActual.menus, 'Selecciona un menú');
  llenarSelect(document.getElementById('mesero'), menuActual.meseros, 'Selecciona tu nombre');
}

// Refresca el menu solo cada 2 minutos, por si el admin lo actualizo
// o por si una carga anterior fallo silenciosamente
setInterval(() => cargarMenu(true), 2 * 60 * 1000);

function llenarSelect(select, items, placeholder){
  select.innerHTML = `<option value="">${placeholder}</option>` +
    items.map(i => `<option value="${i}">${i}</option>`).join('');
}

// ---------- Agregar / quitar con contador (vista mesero) ----------
function agregar(lista, nombre){
  if(!nombre) return;
  const existente = lista.find(i => i.nombre === nombre);
  if(existente){ existente.cantidad++; }
  else{ lista.push({ nombre, cantidad: 1 }); }
}

function cambiarCantidad(lista, nombre, delta){
  const item = lista.find(i => i.nombre === nombre);
  if(!item) return lista;
  item.cantidad += delta;
  if(item.cantidad <= 0) return lista.filter(i => i.nombre !== nombre);
  return lista;
}

function renderSeleccionados(containerId, lista, onCambio){
  const cont = document.getElementById(containerId);
  if(lista.length === 0){ cont.innerHTML = ''; return; }
  cont.innerHTML = lista.map(item => `
    <div class="selected-item" data-nombre="${item.nombre}">
      <span class="nombre">${item.nombre}</span>
      <div class="stepper">
        <button class="menos">−</button>
        <span class="qty">${item.cantidad}</span>
        <button class="mas">+</button>
      </div>
    </div>
  `).join('');
  cont.querySelectorAll('.selected-item').forEach(row => {
    const nombre = row.dataset.nombre;
    row.querySelector('.mas').addEventListener('click', () => onCambio(nombre, 1));
    row.querySelector('.menos').addEventListener('click', () => onCambio(nombre, -1));
  });
}

function onCambioEntrada(nombre, delta){
  entradasSel = cambiarCantidad(entradasSel, nombre, delta);
  renderSeleccionados('lista-entradas-sel', entradasSel, onCambioEntrada);
}

function onCambioMenu(nombre, delta){
  menusSel = cambiarCantidad(menusSel, nombre, delta);
  renderSeleccionados('lista-menus-sel', menusSel, onCambioMenu);
}

document.getElementById('btn-add-entrada').addEventListener('click', () => {
  const val = document.getElementById('select-entrada').value;
  agregar(entradasSel, val);
  renderSeleccionados('lista-entradas-sel', entradasSel, onCambioEntrada);
});

document.getElementById('btn-add-menu').addEventListener('click', () => {
  const val = document.getElementById('select-menu').value;
  agregar(menusSel, val);
  renderSeleccionados('lista-menus-sel', menusSel, onCambioMenu);
});

// ---------- Enviar pedido ----------
const statusEl = document.getElementById('status');
const btnEnviar = document.getElementById('btn-enviar');

btnEnviar.addEventListener('click', async () => {
  const mesero = document.getElementById('mesero').value;
  const mesa = document.getElementById('mesa').value.trim();
  const observacion = document.getElementById('observacion').value.trim();

  if(!mesero){ mostrarEstado(statusEl, 'Selecciona quién eres.', 'err'); return; }
  if(!mesa){ mostrarEstado(statusEl, 'Ingresa el número de mesa.', 'err'); return; }
  if(entradasSel.length === 0){ mostrarEstado(statusEl, 'Selecciona al menos 1 entrada.', 'err'); return; }
  if(menusSel.length === 0){ mostrarEstado(statusEl, 'Selecciona al menos 1 menú.', 'err'); return; }

  btnEnviar.disabled = true;
  mostrarEstado(statusEl, 'Enviando…', '');

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({
        tipo: 'pedido',
        mesero, mesa,
        entradas: entradasSel,
        menus: menusSel,
        observacion
      })
    });
    mostrarEstado(statusEl, 'Pedido enviado a cocina ✓', 'ok');
    document.getElementById('mesa').value = '';
    document.getElementById('observacion').value = '';
    entradasSel = []; menusSel = [];
    renderSeleccionados('lista-entradas-sel', entradasSel, () => {});
    renderSeleccionados('lista-menus-sel', menusSel, () => {});
  }catch(e){
    mostrarEstado(statusEl, 'No se pudo enviar. Intenta de nuevo.', 'err');
  }
  btnEnviar.disabled = false;
});

function mostrarEstado(el, msg, tipo){
  el.textContent = msg;
  el.className = 'status ' + tipo;
}

// ---------- Panel del admin ----------
let adminEntradas = [];
let adminMenus = [];
let adminMeseros = [];

function renderAdmin(){
  adminEntradas = [...menuActual.entradas];
  adminMenus = [...menuActual.menus];
  adminMeseros = [...menuActual.meseros];
  pintarAdminLista('admin-lista-entradas', adminEntradas);
  pintarAdminLista('admin-lista-menus', adminMenus);
  pintarAdminLista('admin-lista-meseros', adminMeseros);
}

function pintarAdminLista(containerId, lista){
  const cont = document.getElementById(containerId);
  if(lista.length === 0){ cont.innerHTML = '<div class="empty-hint">Aún no hay nada cargado.</div>'; return; }
  cont.innerHTML = lista.map((nombre, i) => `
    <div class="admin-item">
      <span>${nombre}</span>
      <button data-i="${i}">✕</button>
    </div>
  `).join('');
  cont.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.i);
      const listas = { 'admin-lista-entradas': 'adminEntradas', 'admin-lista-menus': 'adminMenus', 'admin-lista-meseros': 'adminMeseros' };
      if(containerId === 'admin-lista-entradas') adminEntradas.splice(i, 1);
      else if(containerId === 'admin-lista-menus') adminMenus.splice(i, 1);
      else adminMeseros.splice(i, 1);
      pintarAdminLista(containerId, containerId === 'admin-lista-entradas' ? adminEntradas : (containerId === 'admin-lista-menus' ? adminMenus : adminMeseros));
    });
  });
}

document.getElementById('btn-add-mesero-admin').addEventListener('click', () => {
  const input = document.getElementById('input-nuevo-mesero');
  if(input.value.trim()){
    adminMeseros.push(input.value.trim());
    input.value = '';
    pintarAdminLista('admin-lista-meseros', adminMeseros);

});

document.getElementById('btn-add-entrada-admin').addEventListener('click', () => {
