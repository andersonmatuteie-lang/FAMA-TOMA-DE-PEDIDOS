  --toque:56px;                       /* tamaño mínimo de todo lo que se toca */
  color-scheme: light;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{ background:var(--fondo); color:var(--tinta); font-family:var(--f); font-size:17px; line-height:1.35; -webkit-tap-highlight-color:transparent; overflow:hidden; }
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; touch-action:manipulation; }
:focus-visible{ outline:3px solid var(--aji); outline-offset:2px; }
h1,h2,h3,p{ margin:0; }
.oculto{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- Cabecera ---------- */
.app{ height:100%; display:grid; grid-template-rows:auto 1fr; }
.top{ display:flex; align-items:center; gap:12px; background:var(--marca-hondo); color:#fff;
  padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px)); padding-top:calc(10px + env(safe-area-inset-top,0px)); }
.top img{ height:44px; width:auto; border-radius:10px; }
.top-t{ flex:1; min-width:0; }
.top-t b{ display:block; font-size:19px; font-weight:800; letter-spacing:-.01em; }
.top-t span{ font-size:13px; opacity:.8; }
.pildora{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:999px; background:rgba(255,255,255,.12); color:#fff; font-weight:700; font-size:15px; white-space:nowrap; }
.pildora svg{ width:20px; height:20px; flex:none; }
.pildora:active{ background:rgba(255,255,255,.22); }
.punto{ width:10px; height:10px; border-radius:50%; background:#9fb3b0; flex:none; }
.conexion.ok .punto{ background:#5be08a; box-shadow:0 0 0 4px rgba(91,224,138,.22); }
.conexion.mal .punto{ background:#ff6b52; box-shadow:0 0 0 4px rgba(255,107,82,.28); animation:latir 1.2s ease-in-out infinite; }
@keyframes latir{ 50%{ transform:scale(1.35); } }
.pildora .cuenta[hidden]{ display:none; }
.pildora .cuenta{ background:var(--aji); color:var(--aji-tinta); border-radius:999px; min-width:24px; height:24px; display:grid; place-items:center; font-size:13px; padding:0 6px; }

/* ---------- Distribución principal (tablet echada) ---------- */
.pos{ min-height:0; display:grid; grid-template-columns:minmax(200px, 250px) minmax(0,1fr) minmax(300px, 360px); }
.col{ min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
.col-mesas{ padding:16px 12px 24px 16px; padding-left:max(16px, env(safe-area-inset-left,0px)); border-right:1px solid var(--linea); background:var(--hoja); }
.col-platos{ padding:16px 16px 40px; }
.col-ticket{ min-height:0; overflow:hidden; display:flex; flex-direction:column; background:var(--hoja); border-left:1px solid var(--linea); padding-right:env(safe-area-inset-right,0px); }

.titulo-seccion{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:14px; font-weight:800; letter-spacing:.02em; color:var(--tenue); margin:0 2px 10px; }
.titulo-seccion small{ font-weight:600; font-size:13px; }
.titulo-seccion + *{ margin-bottom:22px; }

/* ---------- Mesas ---------- */
.mesas{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.mesa{ min-height:var(--toque); border-radius:var(--r-chico); background:var(--fondo); border:2px solid transparent; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; transition:transform .1s ease, background .15s ease; }
.mesa:active{ transform:scale(.94); }
.mesa[aria-pressed="true"]{ background:var(--marca); color:#fff; box-shadow:0 4px 12px rgba(10,138,126,.35); }
.mesa.llevar{ grid-column:1 / -1; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; }
.mesa.llevar svg{ width:22px; height:22px; }
.mesa.ocupada::after{ content:""; display:block; width:6px; height:6px; border-radius:50%; background:var(--aji); margin:4px auto 0; }
.sacudir{ animation:sacudir .4s ease; }
@keyframes sacudir{ 20%,60%{ transform:translateX(-6px); } 40%,80%{ transform:translateX(6px); } }

/* ---------- Platos ---------- */
.avisos{ display:grid; gap:8px; margin-bottom:12px; }
.aviso{ display:flex; gap:10px; align-items:center; padding:12px 14px; border-radius:var(--r-chico); font-weight:700; font-size:15px; }
.aviso svg{ width:22px; height:22px; flex:none; }
.aviso.amarillo{ background:#fff3cd; color:#5a4300; }
.aviso.rojo{ background:var(--alerta-suave); color:#7a1f0f; }
.platos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:12px; }
.plato{ position:relative; display:flex; flex-direction:column; justify-content:flex-end; text-align:left; min-height:112px; padding:14px 14px 14px; border-radius:var(--r);
  background:var(--hoja); border:2px solid var(--linea); box-shadow:var(--sombra); transition:transform .1s ease, background .15s ease, border-color .15s ease; overflow:hidden; }
.plato::before{ content:""; position:absolute; left:14px; top:14px; width:28px; height:28px; border-radius:50%; background:var(--marca-suave);
  -webkit-mask:var(--ico-mas) center/62% no-repeat; mask:var(--ico-mas) center/62% no-repeat; background-color:var(--marca); opacity:.35; }
.plato b{ font-size:18px; font-weight:800; line-height:1.15; letter-spacing:-.005em; text-wrap:balance; }
.plato:active{ transform:scale(.97); }
.plato.con{ background:var(--marca); border-color:var(--marca); color:#fff; box-shadow:0 6px 16px rgba(10,138,126,.3); }
.plato.con::before{ opacity:0; }
.plato .n{ position:absolute; top:10px; right:10px; min-width:40px; height:40px; padding:0 10px; border-radius:999px; background:var(--aji); color:var(--aji-tinta); font-size:20px; font-weight:900; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.plato .menos{ position:absolute; top:10px; left:10px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.2); color:#fff; display:grid; place-items:center; }
.plato .menos svg{ width:20px; height:20px; }
.plato .menos:active{ background:rgba(255,255,255,.35); }
.plato.agotado{ background:repeating-linear-gradient(-45deg, #f2f4f4 0 10px, #e9eded 10px 20px); color:#8a9693; border-style:dashed; box-shadow:none; cursor:not-allowed; }
.plato.agotado::before{ display:none; }
.plato.agotado small{ align-self:flex-start; margin-bottom:auto; background:#5e6a68; color:#fff; font-weight:800; font-size:12px; letter-spacing:.04em; padding:4px 8px; border-radius:6px; }
.plato.agotado b{ text-decoration:line-through; }
.bump{ animation:bump .28s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump{ 40%{ transform:scale(1.25); } }
.vacio-menu{ grid-column:1/-1; padding:24px; border:2px dashed var(--linea); border-radius:var(--r); color:var(--tenue); text-align:center; }

/* ---------- Ticket en vivo ---------- */
.tk-cab{ padding:16px 16px 12px; border-bottom:1px solid var(--linea); display:flex; align-items:flex-start; gap:10px; }
.tk-cab div{ flex:1; min-width:0; }
.tk-cab b{ display:block; font-size:24px; font-weight:900; letter-spacing:-.01em; }
.tk-cab span{ color:var(--tenue); font-size:14px; }
.tk-cab b.falta{ color:var(--tenue); font-weight:700; font-size:20px; }
.btn-vaciar{ min-height:44px; padding:0 12px; border-radius:var(--r-chico); color:var(--alerta); font-weight:700; font-size:14px; }
.btn-vaciar:disabled{ opacity:.35; }
.tk-lineas{ flex:1; min-height:0; overflow-y:auto; padding:8px 12px; }
.tk-grupo{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--tenue); margin:12px 6px 6px; }
.lin{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:10px 6px; border-bottom:1px solid var(--linea); animation:entra .25s ease both; }
@keyframes entra{ from{ opacity:0; transform:translateX(16px); } }
.lin-nom{ font-weight:700; font-size:16px; line-height:1.2; }
.lin-nom .etq-nota{ margin-top:5px; }
.etq-nota{ display:inline-flex; align-items:center; gap:4px; background:#fff3cd; color:#5a4300; border-radius:8px; padding:4px 8px; font-size:13px; font-weight:700; }
.btn-nota{ min-height:36px; padding:0 10px; border-radius:10px; border:1.5px dashed var(--marca); color:var(--marca); font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
.btn-nota svg{ width:16px; height:16px; }
.paso{ display:inline-flex; align-items:center; background:var(--fondo); border-radius:999px; }
.paso button{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:22px; font-weight:700; }
.paso button:active{ background:var(--marca-media); }
.paso output{ min-width:24px; text-align:center; font-weight:900; font-size:17px; font-variant-numeric:tabular-nums; }
.tk-vacio{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; color:var(--tenue); padding:24px; }
.tk-vacio svg{ width:56px; height:56px; color:var(--marca-media); }
.tk-pie{ padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--linea); display:grid; gap:10px; }
.tk-pie textarea{ width:100%; min-height:48px; max-height:110px; resize:none; border:1.5px solid var(--linea); border-radius:var(--r-chico); padding:12px; font-size:15px; background:var(--fondo); }
.tk-pie textarea:focus{ outline:none; border-color:var(--marca); background:#fff; }
.enviar{ position:relative; min-height:64px; border-radius:var(--r); background:var(--aji); color:var(--aji-tinta); font-size:20px; font-weight:900; letter-spacing:-.01em;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14); display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .1s ease; overflow:hidden; }
.enviar small{ font-weight:700; font-size:14px; opacity:.8; }
.enviar:active{ transform:translateY(2px); }
.enviar:disabled{ background:#e3e9e8; color:#8a9693; box-shadow:none; }
.enviar svg{ width:26px; height:26px; }
.enviar.enviando{ pointer-events:none; }
.enviar.enviando::after{ content:""; position:absolute; left:0; bottom:0; height:4px; width:40%; background:var(--marca-hondo); animation:carga 1s ease-in-out infinite; }
@keyframes carga{ from{ transform:translateX(-100%); } to{ transform:translateX(260%); } }
.estado-envio{ min-height:20px; text-align:center; font-size:14px; font-weight:700; color:var(--tenue); }
.estado-envio.err{ color:var(--alerta); } .estado-envio.ok{ color:var(--ok); }
.vuela{ animation:vuela .45s ease-in forwards; }
@keyframes vuela{ to{ opacity:0; transform:translateY(-40px) scale(.96); } }

/* Barra del ticket (solo tablet parada) */
.tk-barra{ display:none; }

/* ---------- Hojas (mozo, nota, enviados, admin) ---------- */
.velo{ position:fixed; inset:0; z-index:30; background:rgba(8,28,25,.5); display:flex; align-items:center; justify-content:center; padding:16px; animation:aparece .18s ease; }
.velo[hidden]{ display:none; }
@keyframes aparece{ from{ opacity:0; } }
.hoja{ width:min(640px, 100%); max-height:calc(100% - 32px); overflow-y:auto; background:var(--hoja); border-radius:22px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:sube .25s cubic-bezier(.2,.9,.3,1.1); }
@keyframes sube{ from{ transform:translateY(24px) scale(.98); opacity:.5; } }
.hoja h2{ font-size:26px; font-weight:900; letter-spacing:-.01em; }
.hoja .sub{ color:var(--tenue); margin-top:4px; }
.hoja-cab{ display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
.hoja-cab > div{ flex:1; }
.cerrar{ width:48px; height:48px; border-radius:50%; background:var(--fondo); display:grid; place-items:center; flex:none; }
.cerrar svg{ width:22px; height:22px; }
.mozos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; }
.mozo{ min-height:72px; border-radius:var(--r); background:var(--fondo); font-size:20px; font-weight:800; border:2px solid transparent; display:flex; align-items:center; gap:10px; padding:0 16px; }
.mozo i{ width:40px; height:40px; border-radius:50%; background:var(--marca); color:#fff; display:grid; place-items:center; font-style:normal; font-size:18px; flex:none; }
.mozo[aria-pressed="true"]{ border-color:var(--marca); background:var(--marca-suave); }
.chips{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
.chip{ min-height:52px; padding:0 18px; border-radius:999px; border:2px solid var(--linea); font-weight:700; font-size:16px; background:#fff; }
.chip[aria-pressed="true"]{ background:var(--tinta); border-color:var(--tinta); color:#fff; }
.campo{ width:100%; min-height:52px; border:2px solid var(--linea); border-radius:var(--r-chico); padding:12px 14px; font-size:17px; background:#fff; }
.campo:focus{ outline:none; border-color:var(--marca); }
.botones{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.btn{ min-height:var(--toque); border-radius:var(--r-chico); font-weight:800; font-size:17px; padding:0 18px; }
.btn.prim{ background:var(--marca); color:#fff; }
.btn.sec{ background:var(--fondo); }
.btn.peligro{ background:var(--alerta-suave); color:var(--alerta); }
.enviado{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--linea); }
.enviado .num{ font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; min-width:56px; }
.enviado .det{ font-size:14px; color:var(--tenue); }
.enviado .det b{ color:var(--tinta); font-size:16px; }
.est{ font-size:13px; font-weight:800; border-radius:999px; padding:6px 10px; white-space:nowrap; }
.est.IMPRESO{ background:var(--ok-suave); color:var(--ok); } .est.PENDIENTE,.est.COLA{ background:#fff3cd; color:#5a4300; } .est.ERROR{ background:var(--alerta-suave); color:var(--alerta); }

/* Panel admin */
.adm-sec{ margin-top:22px; }
.adm-sec h3{ font-size:18px; font-weight:900; margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.adm-sec h3 small{ font-size:13px; color:var(--tenue); font-weight:600; }
.adm-add{ display:flex; gap:8px; margin-bottom:8px; }
.adm-add .campo{ flex:1; }
.adm-add .btn{ flex:none; }
.adm-item{ display:flex; align-items:center; gap:10px; min-height:56px; padding:4px 4px 4px 14px; border-radius:var(--r-chico); background:var(--fondo); margin-top:6px; }
.adm-item span{ flex:1; font-weight:700; }
.adm-item.agotado span{ color:var(--tenue); text-decoration:line-through; }
.quitar{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--alerta); }
.quitar svg{ width:20px; height:20px; }
.interruptor{ display:inline-flex; align-items:center; gap:8px; min-height:44px; font-size:13px; font-weight:700; color:var(--tenue); padding:0 6px; }
.interruptor i{ width:46px; height:28px; border-radius:999px; background:#c9d4d2; position:relative; transition:background .2s; flex:none; }
.interruptor i::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
.interruptor[aria-checked="true"]{ color:var(--alerta); }
.interruptor[aria-checked="true"] i{ background:var(--alerta); }
.interruptor[aria-checked="true"] i::after{ transform:translateX(18px); }
.pin{ font-size:32px; letter-spacing:.4em; text-align:center; }
.adm-guardar{ position:sticky; bottom:-22px; background:linear-gradient(to top, #fff 75%, transparent); padding:16px 0 4px; margin-top:12px; }

/* Aviso flotante */
.toast{ position:fixed; z-index:40; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--tinta); color:#fff; padding:14px 20px; border-radius:999px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,.3); animation:toast 2.6s ease both; max-width:calc(100% - 32px); text-align:center; }
.toast.ok{ background:var(--ok); }
.toast.err{ background:var(--alerta); }
@keyframes toast{ 0%{ opacity:0; transform:translate(-50%, 16px); } 10%,85%{ opacity:1; transform:translate(-50%, 0); } 100%{ opacity:0; } }

/* ---------- Siempre horizontal y fija, sin animaciones ---------- */
html,body{ overscroll-behavior:none; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
textarea,input{ user-select:text; -webkit-user-select:text; }
*,*::before,*::after{ animation:none!important; transition:none!important; }
.pildora.falta{ background:var(--aji); color:var(--aji-tinta); }
.mesas{ grid-template-columns:repeat(3, minmax(0,1fr)); }
.mesas .mesa:last-child{ grid-column:1 / -1; }
.mesas-letras{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
.mesas-letras .mesa{ min-height:64px; font-size:24px; }
.gira{ display:none; position:fixed; inset:0; z-index:100; background:var(--marca-hondo); color:#fff; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:32px; }
.gira svg{ width:96px; height:96px; }
.gira b{ font-size:28px; }
.gira span{ font-size:17px; opacity:.85; max-width:32ch; }
@media (orientation: portrait){ .gira{ display:flex; } }
.plato{ padding-top:60px; min-height:0; }
.plato b{ font-size:17px; }
@media (max-height: 640px){ .mesa{ min-height:48px; } .mesas-letras .mesa{ min-height:52px; } .plato{ min-height:96px; } }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition:none!important; }
}
</style>

<script>
/* =====================================================================
   FAMA — Toma de pedidos (tablet horizontal) conectada al Google Sheets actual.
   Envía los pedidos EXACTAMENTE con el mismo formato de siempre, así que
   el Apps Script y el programa de Python de la impresora NO se tocan.
   ===================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8VRaG84TQbETcuvC_0FSglSdxB7NnD27rPn8lbGYSUOoGFN70f6PInxkGHXpg3gb2/exec";
const ADMIN_PIN = "2060";
const MESAS_NUMEROS = ["1","2","3","4","5","6","7","8","9","0"];
const MESAS_LETRAS = ["A","B","C","D"];
const NOTAS_RAPIDAS = ["Presa pierna", "Presa pecho", "Sin cebolla", "Sin ensalada", "Poco arroz", "Sin ají", "Bien cocido", "Para llevar"];

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const guardarLocal = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const leerLocal = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; }catch(e){ return d; } };
const nuevoId = () => "T" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const vibrar = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
const hoyISO = () => new Date().toLocaleDateString("en-CA");
/* Las comas separan platos en el Sheet y en la impresora: dentro de una nota se cambian por " / " */
const sinComas = s => String(s || "").replace(/\s*,\s*/g, " / ").trim();
/* Celdas que en el Sheet dicen "vacio" o están en blanco no son platos */
const limpiarLista = l => (l || []).map(x => String(x).trim()).filter(x => x && x.toLowerCase() !== "vacio" && x.toLowerCase() !== "vacío");
const ICO = {
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  menos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  lapiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  plato:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3v5a1.5 1.5 0 0 0 1.5 1.5V20M21 3c-1.5 1-2 3-2 5.5h2V20"/></svg>',
  alerta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
};
document.documentElement.style.setProperty("--ico-mas", `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="black" stroke-width="3" stroke-linecap="round"/></svg>')}")`);
function toast(msg, tipo){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast " + (tipo || ""); t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
{ const f = new Date().toLocaleDateString("es-PE", { weekday:"long", day:"numeric", month:"long" }); $("fecha-hoy").textContent = f.charAt(0).toUpperCase() + f.slice(1); }

/* ---------- Estado ---------- */
let menu = Object.assign({ entradas:[], menus:[], meseros:[] }, leerLocal("fama-menu", {}));   // última copia: sirve si falla internet
let mozo = leerLocal("fama-mozo", "");
let mesa = "";
let lineas = [];                         // [{k, tipo:'e'|'m', nombre, cantidad, nota}]
let cola = leerLocal("fama-cola", []);   // pedidos que no pudieron salir por falta de internet
let historial = leerLocal("fama-historial", []);
let enviando = false, conectado = true;

/* ---------- Menú desde Google Sheets (igual que antes) ---------- */
async function cargarMenu(){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { cache:"no-store" });
    const d = await res.json();
    menu = { entradas:limpiarLista(d.entradas), menus:limpiarLista(d.menus), meseros:limpiarLista(d.meseros) };
    guardarLocal("fama-menu", menu); marcarConexion(true);
  }catch(e){ marcarConexion(false); }
  // Se quitan del pedido los platos que ya no están en el menú
  lineas = lineas.filter(l => (l.tipo === "e" ? menu.entradas : menu.menus).includes(l.nombre));
  pintarTodo();
}
function pintarTodo(){ pintarMozo(); pintarMesas(); pintarPlatos(); pintarTicket(); pintarAvisos(); }

function pintarMozo(){
  $("nombre-mozo").textContent = mozo || "¿Quién eres?";
  $("btn-mozo").classList.toggle("falta", !mozo);
}
function pintarMesas(){
  const usadas = new Set(historial.filter(h => h.hoy === hoyISO()).map(h => h.mesa));
  const boton = m => `<button class="mesa${usadas.has(m) ? " ocupada" : ""}" data-m="${m}" aria-pressed="${mesa === m}" aria-label="Mesa ${m}">${m}</button>`;
  $("mesas").innerHTML = MESAS_NUMEROS.map(boton).join("");
  $("mesas-letras").innerHTML = MESAS_LETRAS.map(boton).join("");
  document.querySelectorAll(".mesa").forEach(b => b.onclick = () => { mesa = mesa === b.dataset.m ? "" : b.dataset.m; vibrar(8); pintarMesas(); pintarTicket(); });
}
const cantidadDe = (tipo, nombre) => lineas.filter(l => l.tipo === tipo && l.nombre === nombre).reduce((s, l) => s + l.cantidad, 0);
function pintarPlatos(){
  [["g-e", "e", menu.entradas], ["g-m", "m", menu.menus]].forEach(([id, tipo, lista]) => {
    const cont = $(id);
    if(!lista.length){ cont.innerHTML = '<div class="vacio-menu">El admin aún no cargó el menú de hoy.</div>'; return; }
    cont.innerHTML = lista.map((nombre, i) => {
      const n = cantidadDe(tipo, nombre);
      return `<button class="plato${n ? " con" : ""}" data-i="${i}" aria-label="${esc(nombre)}${n ? ", " + n + " en el pedido" : ""}">
        ${n ? `<span class="n" aria-hidden="true">${n}</span><span class="menos" data-menos="1" role="button" aria-label="Quitar uno de ${esc(nombre)}">${ICO.menos}</span>` : ""}<b>${esc(nombre)}</b></button>`;
    }).join("");
    cont.querySelectorAll(".plato").forEach(b => b.addEventListener("click", e => {
      const nombre = lista[+b.dataset.i];
      if(e.target.closest("[data-menos]")) quitarUno(tipo, nombre); else agregar(tipo, nombre);
    }));
  });
}
function agregar(tipo, nombre){
  const l = lineas.find(x => x.tipo === tipo && x.nombre === nombre && !x.nota);
  if(l) l.cantidad++; else lineas.push({ k:nuevoId(), tipo, nombre, cantidad:1, nota:"" });
  vibrar(10); pintarPlatos(); pintarTicket();
}
function quitarUno(tipo, nombre){
  const cand = lineas.filter(x => x.tipo === tipo && x.nombre === nombre);
  const l = cand.find(x => !x.nota) || cand[cand.length - 1]; if(!l) return;
  l.cantidad--; if(l.cantidad <= 0) lineas = lineas.filter(x => x !== l);
  vibrar(6); pintarPlatos(); pintarTicket();
}

/* ---------- Pedido en vivo ---------- */
const totales = () => ({ e: lineas.filter(l => l.tipo === "e").reduce((s,l) => s + l.cantidad, 0), m: lineas.filter(l => l.tipo === "m").reduce((s,l) => s + l.cantidad, 0) });
function textoTotales(){ const t = totales(), p = []; if(t.e) p.push(`${t.e} entrada${t.e > 1 ? "s" : ""}`); if(t.m) p.push(`${t.m} menú${t.m > 1 ? "s" : ""}`); return p.join(" · "); }
function pintarTicket(){
  const hay = lineas.length > 0;
  $("tk-mesa").textContent = mesa ? "Mesa " + mesa : "Elige una mesa";
  $("tk-mesa").className = mesa ? "" : "falta";
  $("tk-sub").textContent = [mozo || "Sin mozo", textoTotales()].filter(Boolean).join(" · ");
  $("btn-vaciar").disabled = !hay;
  const grupo = (tipo, titulo) => {
    const ls = lineas.filter(l => l.tipo === tipo); if(!ls.length) return "";
    return `<p class="tk-grupo">${titulo}</p>` + ls.map(l => `
      <div class="lin" data-k="${l.k}">
        <div class="paso"><button data-acc="menos" aria-label="Uno menos">−</button><output>${l.cantidad}</output><button data-acc="mas" aria-label="Uno más">+</button></div>
        <div class="lin-nom">${esc(l.nombre)}${l.nota ? `<br><span class="etq-nota">${esc(l.nota)}</span>` : ""}</div>
        <button class="btn-nota" data-acc="nota" aria-label="${l.nota ? "Cambiar nota" : "Agregar nota"} a ${esc(l.nombre)}">${ICO.lapiz}${l.nota ? "Cambiar" : "Nota"}</button>
      </div>`).join("");
  };
  $("tk-lineas").innerHTML = hay ? grupo("e", "ENTRADAS") + grupo("m", "MENÚS")
    : `<div class="tk-vacio">${ICO.plato}<b>Todavía no hay platos</b><span>Toca una mesa y luego los platos.</span></div>`;
  $("tk-lineas").querySelectorAll(".lin").forEach(div => {
    const l = lineas.find(x => x.k === div.dataset.k);
    div.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => {
      if(b.dataset.acc === "mas"){ l.cantidad++; vibrar(8); }
      else if(b.dataset.acc === "menos"){ l.cantidad--; if(l.cantidad <= 0) lineas = lineas.filter(x => x !== l); vibrar(6); }
      else return abrirNota(l);
      pintarPlatos(); pintarTicket();
    });
  });
  $("btn-enviar").disabled = !hay || enviando;
}
$("btn-vaciar").onclick = () => abrirHoja(`
  <div class="hoja-cab"><div><h2 id="hoja-t">¿Vaciar el pedido?</h2><p class="sub">Se quitarán todos los platos de este pedido.</p></div></div>
  <div class="botones"><button class="btn sec" data-cerrar>No, seguir</button><button class="btn peligro" id="si-vaciar">Sí, vaciar</button></div>`,
  h => h.querySelector("#si-vaciar").onclick = () => { lineas = []; $("obs-general").value = ""; cerrarHoja(); pintarPlatos(); pintarTicket(); });

/* ---------- Nota por plato ---------- */
function abrirNota(l){
  let texto = l.nota || "";
  const pintar = () => abrirHoja(`
    <div class="hoja-cab"><div><h2 id="hoja-t">Nota para ${esc(l.nombre)}</h2><p class="sub">${l.cantidad > 1 ? `Hay ${l.cantidad}. Puedes ponerla a uno solo o a todos.` : "Toca una o escribe la tuya."}</p></div><button class="cerrar" data-cerrar aria-label="Cerrar">${ICO.x}</button></div>
    <div class="chips">${NOTAS_RAPIDAS.map(n => `<button class="chip" data-n="${esc(n)}" aria-pressed="${texto.toLowerCase().includes(n.toLowerCase())}">${esc(n)}</button>`).join("")}</div>
    <label class="oculto" for="nota-txt">Nota</label><input class="campo" id="nota-txt" maxlength="50" value="${esc(texto)}" placeholder="Escribe una nota" autocomplete="off">
    <div class="botones">
      ${l.cantidad > 1 ? `<button class="btn sec" id="nota-uno">Solo a 1</button><button class="btn prim" id="nota-todos">A los ${l.cantidad}</button>`
                       : `<button class="btn sec" id="nota-quitar">Quitar nota</button><button class="btn prim" id="nota-todos">Guardar nota</button>`}
    </div>`, h => {
      const inp = h.querySelector("#nota-txt");
      inp.addEventListener("input", () => { texto = inp.value; h.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", texto.toLowerCase().includes(c.dataset.n.toLowerCase()))); });
      h.querySelectorAll(".chip").forEach(c => c.onclick = () => {
        let partes = texto.split(/\s*[,/]\s*/).map(x => x.trim()).filter(Boolean);
        const ya = partes.findIndex(x => x.toLowerCase() === c.dataset.n.toLowerCase());
        if(ya >= 0) partes.splice(ya, 1);
        else{ if(c.dataset.n.startsWith("Presa")) partes = partes.filter(x => !x.toLowerCase().startsWith("presa")); partes.push(c.dataset.n); }
        texto = partes.join(" / ").slice(0, 50); pintar();
      });
      const aplicar = soloUno => {
        const nota = sinComas(h.querySelector("#nota-txt").value).slice(0, 50);
        if(soloUno && l.cantidad > 1 && nota){
          l.cantidad--;
          const igual = lineas.find(x => x !== l && x.tipo === l.tipo && x.nombre === l.nombre && x.nota === nota);
          if(igual) igual.cantidad++; else lineas.splice(lineas.indexOf(l) + 1, 0, { k:nuevoId(), tipo:l.tipo, nombre:l.nombre, cantidad:1, nota });
        }else{
          l.nota = nota;
          const igual = lineas.find(x => x !== l && x.tipo === l.tipo && x.nombre === l.nombre && x.nota === nota);
          if(igual){ igual.cantidad += l.cantidad; lineas = lineas.filter(x => x !== l); }
        }
        cerrarHoja(); pintarPlatos(); pintarTicket();
      };
      const t = h.querySelector("#nota-todos"); if(t) t.onclick = () => aplicar(false);
      const u = h.querySelector("#nota-uno"); if(u) u.onclick = () => aplicar(true);
      const q = h.querySelector("#nota-quitar"); if(q) q.onclick = () => { h.querySelector("#nota-txt").value = ""; aplicar(false); };
    });
  pintar();
}

/* ---------- Enviar (mismo formato que siempre) ---------- */
function estadoEnvio(msg, tipo){ const e = $("estado-envio"); e.textContent = msg; e.className = "estado-envio " + (tipo || ""); }
function validar(){
  const t = totales();
  if(!mozo){ elegirMozo(); return "Primero dinos quién eres."; }
  if(!mesa) return "Elige la mesa.";
  if(!t.e) return "Agrega al menos 1 entrada.";
  if(!t.m) return "Agrega al menos 1 menú.";
  return "";
}
function enviarPedido(){
  const falta = validar();
  if(falta){ estadoEnvio(falta, "err"); toast(falta, "err"); vibrar([30, 40, 30]); return; }
  // La nota viaja pegada al nombre del plato: el Sheet y la impresora la muestran sin cambiar nada
  const aItems = tipo => lineas.filter(l => l.tipo === tipo).map(l => ({ nombre: l.nota ? `${l.nombre} (${sinComas(l.nota).toUpperCase()})` : l.nombre, cantidad:l.cantidad }));
  const pedido = { tipo:"pedido", mesero:mozo, mesa, entradas:aItems("e"), menus:aItems("m"), observacion:$("obs-general").value.trim() };
  const id = nuevoId(), hora = new Date().toLocaleTimeString("es-PE", { hour:"2-digit", minute:"2-digit" });
  cola.push({ id, pedido }); guardarLocal("fama-cola", cola);
  historial.unshift({ id, hoy:hoyISO(), mesa, hora, resumen:textoTotales(), estado:"COLA" });
  historial = historial.slice(0, 40); guardarLocal("fama-historial", historial);
  lineas = []; mesa = ""; $("obs-general").value = ""; pintarTodo();
  vibrar(20); estadoEnvio("Enviando…");
  enviarCola();
}
$("btn-enviar").onclick = enviarPedido;

async function enviarCola(){
  if(enviando) return; enviando = true; pintarTicket();
  try{
    while(cola.length){
      const { id, pedido } = cola[0];
      try{
        await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", body:JSON.stringify(pedido) });
      }catch(e){
        marcarConexion(false);
        estadoEnvio("Sin internet. El pedido quedó guardado y se enviará solo.", "err");
        break;                                      // se reintenta en unos segundos
      }
      cola.shift(); guardarLocal("fama-cola", cola);
      const h = historial.find(x => x.id === id); if(h){ h.estado = "ENVIADO"; guardarLocal("fama-historial", historial); }
      marcarConexion(true);
      estadoEnvio(`Mesa ${pedido.mesa}: enviado a cocina ✓`, "ok"); toast(`Mesa ${pedido.mesa} enviada a cocina ✓`, "ok");
    }
  }finally{ enviando = false; pintarTicket(); pintarAvisos(); }
}
setInterval(() => { if(cola.length) enviarCola(); }, 10000);
window.addEventListener("online", () => { marcarConexion(true); enviarCola(); });
window.addEventListener("offline", () => marcarConexion(false));

/* ---------- Avisos y conexión ---------- */
function pintarAvisos(){
  $("avisos").innerHTML = cola.length ? `<div class="aviso amarillo">${ICO.alerta}<span>${cola.length} pedido${cola.length > 1 ? "s" : ""} guardado${cola.length > 1 ? "s" : ""} en esta tablet esperando internet. Se enviará${cola.length > 1 ? "n" : ""} solo${cola.length > 1 ? "s" : ""}. No los vuelvas a tomar.</span></div>` : "";
  $("cuenta-cola").hidden = !cola.length; $("cuenta-cola").textContent = cola.length;
}
function marcarConexion(ok){
  conectado = ok;
  $("conexion").className = "pildora conexion " + (ok ? "ok" : "mal");
  $("conexion").querySelector("span").textContent = ok ? "Conectado" : "Sin internet";
}

/* ---------- Hojas ---------- */
function abrirHoja(html, conectar){
  $("hoja").innerHTML = html; $("velo").hidden = false;
  $("hoja").querySelectorAll("[data-cerrar]").forEach(b => b.onclick = cerrarHoja);
  if(conectar) conectar($("hoja"));
}
function cerrarHoja(){ $("velo").hidden = true; $("hoja").innerHTML = ""; }
$("velo").addEventListener("click", e => { if(e.target.id === "velo" && mozo) cerrarHoja(); });

function elegirMozo(){
  abrirHoja(`
    <div class="hoja-cab"><div><h2 id="hoja-t">¿Quién eres?</h2><p class="sub">Esta tablet te recordará hasta que elijas a otra persona.</p></div>${mozo ? `<button class="cerrar" data-cerrar aria-label="Cerrar">${ICO.x}</button>` : ""}</div>
    <div class="mozos">${menu.meseros.map(m => `<button class="mozo" data-m="${esc(m)}" aria-pressed="${mozo === m}"><i>${esc(m.charAt(0).toUpperCase())}</i>${esc(m)}</button>`).join("") || '<p class="sub">El admin aún no cargó a los mozos.</p>'}</div>`,
    h => h.querySelectorAll(".mozo").forEach(b => b.onclick = () => { mozo = b.dataset.m; guardarLocal("fama-mozo", mozo); vibrar(10); cerrarHoja(); pintarMozo(); pintarTicket(); toast(`Hola, ${mozo}`); }));
}
$("btn-mozo").onclick = elegirMozo;

$("btn-enviados").onclick = () => {
  const nombres = { COLA:"Por enviar", ENVIADO:"Enviado" };
  const lista = historial.filter(h => h.hoy === hoyISO());
  abrirHoja(`
    <div class="hoja-cab"><div><h2 id="hoja-t">Enviados hoy</h2><p class="sub">Pedidos tomados en esta tablet.</p></div><button class="cerrar" data-cerrar aria-label="Cerrar">${ICO.x}</button></div>
    ${lista.length ? lista.map(h => `<div class="enviado"><span class="num">${esc(h.mesa)}</span>
      <span class="det"><b>Mesa ${esc(h.mesa)}</b> · ${esc(h.hora)}<br>${esc(h.resumen || "")}</span><span class="est ${h.estado === "ENVIADO" ? "IMPRESO" : "COLA"}">${nombres[h.estado] || h.estado}</span></div>`).join("")
      : '<p class="sub">Todavía no hay pedidos hoy en esta tablet.</p>'}`);
};

/* ---------- Pantalla completa y horizontal fija ---------- */
$("btn-pantalla").onclick = async () => {
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    if(screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
  }catch(e){}
};

/* ---------- Panel del admin (guarda en el Sheet como antes) ---------- */
let borrador = null;
$("btn-admin").onclick = () => abrirHoja(`
  <div class="hoja-cab"><div><h2 id="hoja-t">Panel del admin</h2><p class="sub">Ingresa la clave del administrador.</p></div><button class="cerrar" data-cerrar aria-label="Cerrar">${ICO.x}</button></div>
  <label class="oculto" for="pin">Clave</label><input class="campo pin" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <p class="estado-envio err" id="pin-msg"></p>
  <div class="botones"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn prim" id="pin-ok">Entrar</button></div>`, h => {
    const entrar = () => {
      if(h.querySelector("#pin").value.trim() !== ADMIN_PIN){ h.querySelector("#pin-msg").textContent = "Clave incorrecta."; h.querySelector("#pin").value = ""; vibrar([30,40,30]); return; }
      borrador = { entradas:[...menu.entradas], menus:[...menu.menus], meseros:[...menu.meseros] };
      pintarAdmin();
    };
    h.querySelector("#pin-ok").onclick = entrar;
    h.querySelector("#pin").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
    setTimeout(() => h.querySelector("#pin").focus(), 50);
  });
function pintarAdmin(){
  const sec = (clave, titulo, ejemplo) => `
    <section class="adm-sec"><h3>${titulo}</h3>
      <div class="adm-add"><label class="oculto" for="add-${clave}">${titulo}</label><input class="campo" id="add-${clave}" placeholder="${ejemplo}" autocomplete="off"><button class="btn prim" data-add="${clave}">Agregar</button></div>
      ${borrador[clave].map((x, i) => `<div class="adm-item"><span>${esc(x)}</span><button class="quitar" data-quitar="${clave}" data-i="${i}" aria-label="Quitar ${esc(x)}">${ICO.x}</button></div>`).join("") || '<p class="sub">Vacío.</p>'}
    </section>`;
  abrirHoja(`
    <div class="hoja-cab"><div><h2 id="hoja-t">Panel del admin</h2><p class="sub">Los cambios se guardan en el Google Sheet.</p></div><button class="cerrar" data-cerrar aria-label="Cerrar">${ICO.x}</button></div>
    ${sec("entradas", "Entradas", "Ej: Sopa criolla")}
    ${sec("menus", "Menús", "Ej: Tallarín verde con pollo")}
    ${sec("meseros", "Mozos", "Ej: Paola")}
    <div class="adm-guardar"><button class="btn prim" id="adm-guardar" style="width:100%">Guardar menú del día</button><p class="estado-envio" id="adm-msg" aria-live="polite"></p></div>`, h => {
      h.querySelectorAll("[data-add]").forEach(b => {
        const inp = h.querySelector("#add-" + b.dataset.add);
        const add = () => { const v = sinComas(inp.value); if(v && !borrador[b.dataset.add].some(x => x.toLowerCase() === v.toLowerCase())){ borrador[b.dataset.add].push(v); pintarAdmin(); } };
        b.onclick = add; inp.addEventListener("keydown", e => { if(e.key === "Enter") add(); });
      });
      h.querySelectorAll("[data-quitar]").forEach(b => b.onclick = () => { borrador[b.dataset.quitar].splice(+b.dataset.i, 1); pintarAdmin(); });
      h.querySelector("#adm-guardar").onclick = async () => {
        const msg = h.querySelector("#adm-msg"); msg.textContent = "Guardando…"; msg.className = "estado-envio";
        try{
          await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", body:JSON.stringify({ tipo:"actualizar_menu", ...borrador }) });
          await new Promise(r => setTimeout(r, 1200));
          await cargarMenu(); cerrarHoja(); toast("Menú guardado ✓", "ok");
        }catch(e){ msg.textContent = "Sin internet. No se guardó."; msg.className = "estado-envio err"; }
      };
    });
}

/* ---------- Instalable como app (sin la barra de Google) ---------- */
if("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
const comoApp = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
if(comoApp) $("btn-pantalla").hidden = true;          // instalada ya está a pantalla completa

/* ---------- Arranque ---------- */
pintarTodo();
cargarMenu().then(() => { if(!mozo || !menu.meseros.includes(mozo)){ mozo = ""; pintarMozo(); elegirMozo(); } });
if(cola.length) enviarCola();
setInterval(cargarMenu, 2 * 60 * 1000);
