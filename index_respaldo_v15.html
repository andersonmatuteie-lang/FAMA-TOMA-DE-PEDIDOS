<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fama — Toma de Pedidos</title>
<!-- VERSION: 2026-09-14-v15 (un solo archivo HTML, logo incrustado de nuevo) -->
<style>
  :root{
    --bg: #0b4a44;
    --brand: #0db7aa;
    --teal-dark: #087b72;
    --surface: #ffffff;
    --tile-bg: #cdf0ec;
    --ink: #163a36;
    --muted: #6f8683;
    --line: rgba(10,60,55,0.13);
    --danger: #d64f36;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100vh;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 28px 14px 120px;
  }
  .wrap{ width:100%; max-width:460px; }

  .brand{ text-align:center; margin-bottom:16px; }
  .brand .logo{ width:130px; height:130px; margin:0 auto; border-radius:26px; overflow:hidden; }
  .brand .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand h1{
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    margin: 0;
    color: #ffffff;
  }

  .switch-row{ display:flex; gap:8px; justify-content:center; margin-bottom:24px; }
  .switch-btn{
    border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700;
    cursor:pointer; font-family:inherit; transition:background .15s ease, color .15s ease;
  }
  .switch-btn.active{ background: #ffffff; color: var(--teal-dark); }
  .switch-btn.inactive{ background:transparent; color: #ffffff; border:1.5px solid rgba(255,255,255,.55); }

  .view{ display:none; }
  .view.visible{ display:block; }

  .section-title{ text-align:center; margin-bottom:20px; }
  .section-title h2{ font-size:19px; margin:0 0 4px; font-weight:800; color:#ffffff; text-transform:uppercase; letter-spacing:.02em; }
  .section-title span{ font-size:12.5px; color:rgba(255,255,255,.8); }

  .card{
    background: var(--surface);
    border-radius: 20px;
    padding: 20px 18px;
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,0.14);
  }

  label.field-label{
    display:block; font-size:13.5px; font-weight:800; letter-spacing:.04em;
    text-transform: uppercase;
    color: var(--teal-dark); margin: 22px 0 10px;
  }
  label.field-label:first-child{ margin-top:0; }

  select, input[type="text"], textarea{
    width:100%;
    background: var(--tile-bg);
    border: 1.5px solid var(--line);
    color: var(--ink);
    font-weight: 600;
    border-radius: 13px;
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus{ outline:none; border-color:var(--brand); }
  textarea{ resize:vertical; min-height:64px; font-weight:400; background:#ffffff; }

  /* --- Cuadricula de platos --- */
  .tile-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:9px;
  }
  .tile{
    position:relative;
    background: var(--brand);
    border: 2px solid var(--brand);
    border-radius: 14px;
    padding: 14px 12px 16px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    transition: border-color .12s ease, background .12s ease, color .12s ease;
    min-height: 64px;
    display:flex; align-items:flex-end;
    color: #ffffff;
  }
  .tile span{ font-size:13.5px; font-weight:800; line-height:1.3; color:#ffffff; }
  .tile.on{ border-color: #ffffff; }
  .tile .badge{
    position:absolute; top:-8px; right:-8px;
    background: var(--bg); color: #ffffff;
    font-size:12px; font-weight:800;
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    z-index:2; cursor:pointer;
  }
  .tile .minus{
    position:absolute; top:-8px; left:-8px;
    background: #ffffff; color: var(--danger);
    border: 1.5px solid var(--danger);
    font-size:15px; font-weight:800; line-height:1;
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    z-index:2; cursor:pointer;
  }
  .empty-hint{ font-size:13px; color:var(--muted); padding:8px 2px; grid-column: 1 / -1; }

  .foot-note{ text-align:center; font-size:11.5px; color:rgba(255,255,255,.8); margin-top:16px; line-height:1.5; }

  /* --- Barra fija de enviar --- */
  .send-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    pointer-events:none;
  }
  .send-bar-inner{ width:100%; max-width:460px; pointer-events:auto; }
  .submit-btn{
    width:100%;
    background: #ffffff;
    color: var(--teal-dark);
    border:none;
    border-radius: 999px;
    padding: 15px;
    font-size: 15px;
    font-weight: 800;
    cursor:pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.28);
  }
  .submit-btn:disabled{ opacity:.55; cursor:not-allowed; box-shadow:none; }
  .status{ text-align:center; margin-top:10px; font-size:13px; min-height:16px; font-weight:600; }
  .status.ok{ color:#ffffff; }
  .status.err{ color: #ffe1da; }

  /* --- Panel admin --- */
  .admin-list{ display:flex; flex-direction:column; gap:7px; margin-top:9px; }
  .admin-item{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--tile-bg); border:1.5px solid var(--line); border-radius:12px;
    padding: 10px 12px; font-size:14px; font-weight:700; color:var(--ink);
  }
  .admin-item button{
    background:none; border:none; color: var(--danger); font-size:18px; cursor:pointer; line-height:1;
  }
  .add-row{ display:flex; gap:8px; }
  .add-row input{ flex:1; }
  .add-btn{
    flex:none; background: var(--brand); color: #ffffff; border:none;
    border-radius: 12px; padding: 0 16px; font-weight:800; font-size:14px; cursor:pointer;
  }
  .save-btn{
    width:100%; margin-top:22px; background: var(--brand); color: #ffffff;
    border:none; border-radius:999px; padding:14px; font-size:14.5px; font-weight:800; cursor:pointer;
  }
</style>
</head>

<script>const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8VRaG84TQbETcuvC_0FSglSdxB7NnD27rPn8lbGYSUOoGFN70f6PInxkGHXpg3gb2/exec";
const ADMIN_PIN = "2060";

// ---------- Cambio de vista ----------
const btnTabPedido = document.getElementById('btn-tab-pedido');
const btnTabAdmin = document.getElementById('btn-tab-admin');
const viewPedido = document.getElementById('view-pedido');
const viewAdmin = document.getElementById('view-admin');
const sendBar = document.getElementById('send-bar');

btnTabPedido.addEventListener('click', () => mostrarVista('pedido'));
btnTabAdmin.addEventListener('click', () => {
  const intento = prompt("Clave del Panel del Admin:");
  if(intento === null) return;
  if(intento === ADMIN_PIN){ mostrarVista('admin'); }
  else{ alert("Clave incorrecta."); }
});

function mostrarVista(nombre){
  const esPedido = nombre === 'pedido';
  viewPedido.classList.toggle('visible', esPedido);
  viewAdmin.classList.toggle('visible', !esPedido);
  sendBar.style.display = esPedido ? 'flex' : 'none';
  btnTabPedido.classList.toggle('active', esPedido);
  btnTabPedido.classList.toggle('inactive', !esPedido);
  btnTabAdmin.classList.toggle('active', !esPedido);
  btnTabAdmin.classList.toggle('inactive', esPedido);
  if(!esPedido) renderAdmin();
}

document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-PE', {
  weekday: 'long', day: 'numeric', month: 'long'
});

// ---------- Estado del menú del día ----------
let menuActual = { entradas: [], menus: [], meseros: [] };
let entradasSel = [];   // [{nombre, cantidad}]
let menusSel = [];

let fallando = false;

function enviarLog(evento, detalle){
  fetch(APPS_SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    body: JSON.stringify({ tipo: 'log', evento, detalle })
  }).catch(() => {});
}

async function cargarMenu(reintentar = true, intentoNum = 0){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    menuActual.entradas = data.entradas || [];
    menuActual.menus = data.menus || [];
    menuActual.meseros = data.meseros || [];
    if(fallando){ fallando = false; enviarLog('recuperado', `tras ${intentoNum} reintento(s)`); }
  }catch(e){
    console.log("No se pudo cargar el menu, reintentando...", e);
    if(!fallando){ fallando = true; enviarLog('fallo_conexion', navigator.userAgent.slice(0,80)); }
    if(reintentar){
      const espera = Math.min(30000, 3000 * Math.pow(2, intentoNum));
      setTimeout(() => cargarMenu(true, intentoNum + 1), espera);
    }
    return;
  }
  renderGrid('grid-entradas', menuActual.entradas, entradasSel, onTocarEntrada, onRestarEntrada);
  renderGrid('grid-menus', menuActual.menus, menusSel, onTocarMenu, onRestarMenu);
  llenarSelect(document.getElementById('mesero'), menuActual.meseros, 'Selecciona tu nombre');
}

setInterval(() => cargarMenu(true), 5 * 60 * 1000);

function llenarSelect(select, items, placeholder){
  select.innerHTML = `<option value="">${placeholder}</option>` +
    items.map(i => `<option value="${i}">${i}</option>`).join('');
}

// ---------- Cuadrícula de platos tocables ----------
function renderGrid(containerId, items, seleccion, onTocar, onRestar){
  const cont = document.getElementById(containerId);
  if(!items || items.length === 0){
    cont.innerHTML = '<div class="empty-hint">El admin aún no cargó el menú de hoy.</div>';
    return;
  }
  cont.innerHTML = items.map(nombre => {
    const sel = seleccion.find(i => i.nombre === nombre);
    const cant = sel ? sel.cantidad : 0;
    return `
      <div class="tile ${cant > 0 ? 'on' : ''}" data-nombre="${nombre}">
        ${cant > 0 ? `<button class="minus" data-nombre="${nombre}">−</button><div class="badge">${cant}</div>` : ''}
        <span>${nombre}</span>
      </div>
    `;
  }).join('');
  cont.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', (e) => {
      if(e.target.closest('.minus')) return; // el boton de restar maneja su propio click
      onTocar(tile.dataset.nombre);
    });
  });
  cont.querySelectorAll('.minus').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      onRestar(btn.dataset.nombre);
    });
  });
}

function onTocarEntrada(nombre){
  const existente = entradasSel.find(i => i.nombre === nombre);
  if(existente) existente.cantidad++;
  else entradasSel.push({ nombre, cantidad: 1 });
  renderGrid('grid-entradas', menuActual.entradas, entradasSel, onTocarEntrada, onRestarEntrada);
  actualizarBotonEnviar();
}

function onRestarEntrada(nombre){
  const item = entradasSel.find(i => i.nombre === nombre);
  if(!item) return;
  item.cantidad--;
  if(item.cantidad <= 0) entradasSel = entradasSel.filter(i => i.nombre !== nombre);
  renderGrid('grid-entradas', menuActual.entradas, entradasSel, onTocarEntrada, onRestarEntrada);
  actualizarBotonEnviar();
}

function onTocarMenu(nombre){
  const existente = menusSel.find(i => i.nombre === nombre);
  if(existente) existente.cantidad++;
  else menusSel.push({ nombre, cantidad: 1 });
  renderGrid('grid-menus', menuActual.menus, menusSel, onTocarMenu, onRestarMenu);
  actualizarBotonEnviar();
}

function onRestarMenu(nombre){
  const item = menusSel.find(i => i.nombre === nombre);
  if(!item) return;
  item.cantidad--;
  if(item.cantidad <= 0) menusSel = menusSel.filter(i => i.nombre !== nombre);
  renderGrid('grid-menus', menuActual.menus, menusSel, onTocarMenu, onRestarMenu);
  actualizarBotonEnviar();
}

function actualizarBotonEnviar(){
  const totalEntradas = entradasSel.reduce((s,i)=>s+i.cantidad,0);
  const totalMenus = menusSel.reduce((s,i)=>s+i.cantidad,0);
  const partes = [];
  if(totalEntradas > 0) partes.push(`${totalEntradas} entrada${totalEntradas===1?'':'s'}`);
  if(totalMenus > 0) partes.push(`${totalMenus} menú${totalMenus===1?'':'s'}`);
  btnEnviar.textContent = partes.length > 0 ? `Enviar pedido (${partes.join(', ')})` : 'Enviar pedido';
}

// ---------- Enviar pedido ----------
const statusEl = document.getElementById('status');
const btnEnviar = document.getElementById('btn-enviar');

btnEnviar.addEventListener('click', async () => {
  const mesero = document.getElementById('mesero').value;
  const mesa = document.getElementById('mesa').value.trim();
  const observacion = document.getElementById('observacion').value.trim();

  if(!mesero){ mostrarEstado(statusEl, 'Selecciona quién eres.', 'err'); return; }
  if(!mesa){ mostrarEstado(statusEl, 'Ingresa el número de mesa.', 'err'); return; }
  if(entradasSel.length === 0){ mostrarEstado(statusEl, 'Selecciona al menos 1 entrada.', 'err'); return; }
  if(menusSel.length === 0){ mostrarEstado(statusEl, 'Selecciona al menos 1 menú.', 'err'); return; }

  btnEnviar.disabled = true;
  mostrarEstado(statusEl, 'Enviando…', '');

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({ tipo: 'pedido', mesero, mesa, entradas: entradasSel, menus: menusSel, observacion })
    });
    mostrarEstado(statusEl, 'Pedido enviado a cocina ✓', 'ok');
    document.getElementById('mesa').value = '';
    document.getElementById('observacion').value = '';
    entradasSel = []; menusSel = [];
    renderGrid('grid-entradas', menuActual.entradas, entradasSel, onTocarEntrada, onRestarEntrada);
    renderGrid('grid-menus', menuActual.menus, menusSel, onTocarMenu, onRestarMenu);
    actualizarBotonEnviar();
  }catch(e){
    mostrarEstado(statusEl, 'No se pudo enviar. Intenta de nuevo.', 'err');
  }
  btnEnviar.disabled = false;
});

function mostrarEstado(el, msg, tipo){
  el.textContent = msg;
  el.className = 'status ' + tipo;
}

// ---------- Panel del admin ----------
let adminEntradas = [];
let adminMenus = [];
let adminMeseros = [];

function renderAdmin(){
  adminEntradas = [...menuActual.entradas];
  adminMenus = [...menuActual.menus];
  adminMeseros = [...menuActual.meseros];
  pintarAdminLista('admin-lista-entradas', adminEntradas);
  pintarAdminLista('admin-lista-menus', adminMenus);
  pintarAdminLista('admin-lista-meseros', adminMeseros);
}

function pintarAdminLista(containerId, lista){
  const cont = document.getElementById(containerId);
  if(lista.length === 0){ cont.innerHTML = '<div class="empty-hint">Aún no hay nada cargado.</div>'; return; }
  cont.innerHTML = lista.map((nombre, i) => `
    <div class="admin-item"><span>${nombre}</span><button data-i="${i}">✕</button></div>
  `).join('');
  cont.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.i);
      if(containerId === 'admin-lista-entradas') adminEntradas.splice(i, 1);
      else if(containerId === 'admin-lista-menus') adminMenus.splice(i, 1);
      else adminMeseros.splice(i, 1);
      pintarAdminLista(containerId, containerId === 'admin-lista-entradas' ? adminEntradas : (containerId === 'admin-lista-menus' ? adminMenus : adminMeseros));
    });
  });
}

document.getElementById('btn-add-mesero-admin').addEventListener('click', () => {
  const input = document.getElementById('input-nuevo-mesero');
  if(input.value.trim()){ adminMeseros.push(input.value.trim()); input.value=''; pintarAdminLista('admin-lista-meseros', adminMeseros); }
});
document.getElementById('btn-add-entrada-admin').addEventListener('click', () => {
  const input = document.getElementById('input-nueva-entrada');
  if(input.value.trim()){ adminEntradas.push(input.value.trim()); input.value=''; pintarAdminLista('admin-lista-entradas', adminEntradas); }
});
document.getElementById('btn-add-menu-admin').addEventListener('click', () => {
  const input = document.getElementById('input-nuevo-menu');
  if(input.value.trim()){ adminMenus.push(input.value.trim()); input.value=''; pintarAdminLista('admin-lista-menus', adminMenus); }
});

const statusAdmin = document.getElementById('status-admin');

document.getElementById('btn-guardar-menu').addEventListener('click', async () => {
  mostrarEstado(statusAdmin, 'Guardando…', '');
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({ tipo: 'actualizar_menu', entradas: adminEntradas, menus: adminMenus, meseros: adminMeseros })
    });
    await new Promise(r => setTimeout(r, 800));
    await cargarMenu();
    mostrarEstado(statusAdmin, 'Cambios guardados ✓', 'ok');
  }catch(e){
    mostrarEstado(statusAdmin, 'No se pudo guardar. Intenta de nuevo.', 'err');
  }
});

cargarMenu();
</script>
